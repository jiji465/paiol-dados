<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Planta e processos da Paiol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Layout: barra do topo fixa; menu lateral (visão geral, planta, setores, processos, pendências) e uma tela por vez; edição em tabelas e num painel lateral */
:root{
  --bg:#eef1ec; --painel:#ffffff; --painel-2:#f7f8f5; --campo:#ffffff; --hover:#f1f4ef; --linha:#dde2da; --linha-forte:#c3cbc0;
  --tinta:#1e2621; --tinta-suave:#5a665e; --tinta-fraca:#87918a;
  --acento:#2f6b45; --acento-tinta:#ffffff; --acento-suave:#e3efe6; --cab-tabela:#f1f5f0;
  --piso:#fbfbf7; --grade:#e4e7e0; --grade-forte:#cdd3c9; --parede:#2b352f;
  --raia-a:#fbfbf7; --raia-b:#f3f5f0; --raia-cab:#eaeee8; --seta:#7b867e; --rota:#33413a; --sombra:rgba(30,38,33,.12);
  --selecao:#c86a1c; --sel-fundo:#fbeee0; --perigo:#b3402c;
  --ok:#2f7a4a; --ok-fundo:#e2f0e6; --aviso:#a8650f; --aviso-fundo:#fbefd9; --neutro:#7b847e;
  --r0:#2b6cb0; --r1:#c05621; --r2:#2f855a; --r3:#805ad5; --r4:#b83280; --r5:#4a5568; --r-tinta:#ffffff;
  --g-ferramentas-f:#e9e4d4; --g-ferramentas-b:#7a6a3e; --g-aves-f:#d9ecf3; --g-aves-b:#2f7f9c;
  --g-selaria-f:#eddccd; --g-selaria-b:#8a5a34; --g-veterinario-f:#e5ddf1; --g-veterinario-b:#6f559c;
  --g-racao-f:#dbe9d6; --g-racao-b:#4a7f52; --g-pet-f:#d3ebe4; --g-pet-b:#2b7c68;
  --g-calcados-f:#f2dbe2; --g-calcados-b:#9c4a66; --g-sementes-f:#e9ecd0; --g-sementes-b:#6e7a2a;
  --g-atendimento-f:#dae4f3; --g-atendimento-b:#3a67a8; --g-caixa-f:#f3e4c4; --g-caixa-b:#a8721d;
  --g-equipe-f:#f5d8cf; --g-equipe-b:#c25640; --g-apoio-f:#e2e5df; --g-apoio-b:#68726b;
  --f-titulo:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-texto:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-medida:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --painel:#1a1f1c; --painel-2:#161b18; --campo:#111512; --hover:#222a25; --linha:#2c3530; --linha-forte:#3e4a43;
    --tinta:#e4eae5; --tinta-suave:#a2ada6; --tinta-fraca:#7d8882;
    --acento:#5fb27a; --acento-tinta:#0d1a11; --acento-suave:#1f3427; --cab-tabela:#1f2622;
    --piso:#181d19; --grade:#222924; --grade-forte:#2d362f; --parede:#cdd6cf;
    --raia-a:#171c18; --raia-b:#1c221e; --raia-cab:#232b26; --seta:#8f9a93; --rota:#d5ddd7; --sombra:rgba(0,0,0,.5);
    --selecao:#f0a052; --sel-fundo:#3a2a18; --perigo:#f08a72;
    --ok:#6cc08a; --ok-fundo:#1d3226; --aviso:#e7a64a; --aviso-fundo:#3a2c14; --neutro:#8f9a93;
    --r0:#7fb3ea; --r1:#f0a070; --r2:#78c99a; --r3:#b7a0ef; --r4:#ec8fc4; --r5:#b4bdc9; --r-tinta:#10140f;
    --g-ferramentas-f:#322d20; --g-ferramentas-b:#c9b37a; --g-aves-f:#1b3440; --g-aves-b:#72bfd9;
    --g-selaria-f:#3a2a1d; --g-selaria-b:#d29b6c; --g-veterinario-f:#2c2540; --g-veterinario-b:#ad97da;
    --g-racao-f:#21362a; --g-racao-b:#79b886; --g-pet-f:#1a3530; --g-pet-b:#69c2aa;
    --g-calcados-f:#3d222b; --g-calcados-b:#e08aa7; --g-sementes-f:#2f3318; --g-sementes-b:#b7c66a;
    --g-atendimento-f:#1e2b40; --g-atendimento-b:#86a9e0; --g-caixa-f:#3a2e17; --g-caixa-b:#ddae58;
    --g-equipe-f:#3f231d; --g-equipe-b:#ec8b75; --g-apoio-f:#252b27; --g-apoio-b:#9ea8a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --painel:#1a1f1c; --painel-2:#161b18; --campo:#111512; --hover:#222a25; --linha:#2c3530; --linha-forte:#3e4a43;
  --tinta:#e4eae5; --tinta-suave:#a2ada6; --tinta-fraca:#7d8882;
  --acento:#5fb27a; --acento-tinta:#0d1a11; --acento-suave:#1f3427; --cab-tabela:#1f2622;
  --piso:#181d19; --grade:#222924; --grade-forte:#2d362f; --parede:#cdd6cf;
  --raia-a:#171c18; --raia-b:#1c221e; --raia-cab:#232b26; --seta:#8f9a93; --rota:#d5ddd7; --sombra:rgba(0,0,0,.5);
  --selecao:#f0a052; --sel-fundo:#3a2a18; --perigo:#f08a72;
  --ok:#6cc08a; --ok-fundo:#1d3226; --aviso:#e7a64a; --aviso-fundo:#3a2c14; --neutro:#8f9a93;
  --r0:#7fb3ea; --r1:#f0a070; --r2:#78c99a; --r3:#b7a0ef; --r4:#ec8fc4; --r5:#b4bdc9; --r-tinta:#10140f;
  --g-ferramentas-f:#322d20; --g-ferramentas-b:#c9b37a; --g-aves-f:#1b3440; --g-aves-b:#72bfd9;
  --g-selaria-f:#3a2a1d; --g-selaria-b:#d29b6c; --g-veterinario-f:#2c2540; --g-veterinario-b:#ad97da;
  --g-racao-f:#21362a; --g-racao-b:#79b886; --g-pet-f:#1a3530; --g-pet-b:#69c2aa;
  --g-calcados-f:#3d222b; --g-calcados-b:#e08aa7; --g-sementes-f:#2f3318; --g-sementes-b:#b7c66a;
  --g-atendimento-f:#1e2b40; --g-atendimento-b:#86a9e0; --g-caixa-f:#3a2e17; --g-caixa-b:#ddae58;
  --g-equipe-f:#3f231d; --g-equipe-b:#ec8b75; --g-apoio-f:#252b27; --g-apoio-b:#9ea8a1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--tinta);font-family:var(--f-texto);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--painel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--selecao);outline-offset:2px}
/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--painel);border-bottom:1px solid var(--linha)}
.topo-int{max-width:1480px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{display:grid;gap:0;min-width:0}
.marca small{font:600 11px/1.2 var(--f-texto);letter-spacing:.14em;text-transform:uppercase;color:var(--acento)}
.marca h1{margin:0;font:700 22px/1.15 var(--f-titulo);letter-spacing:.01em}
.acoes-topo{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--tinta-suave);padding:5px 11px;border:1px solid var(--linha);border-radius:999px;background:var(--painel-2);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cor-status,var(--neutro))}
.status[data-tipo="ok"]{--cor-status:var(--ok)}
.status[data-tipo="aviso"]{--cor-status:var(--aviso)}
.status[data-tipo="salvando"]{--cor-status:var(--selecao)}
.btn{font:600 14px/1 var(--f-texto);color:var(--tinta);background:var(--painel);border:1px solid var(--linha-forte);border-radius:8px;padding:9px 13px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primario{background:var(--acento);border-color:var(--acento);color:var(--acento-tinta)}
.btn-primario:hover:not(:disabled){background:var(--acento);filter:brightness(1.08)}
.btn-pequeno{padding:7px 10px;font-size:13px}
.btn-perigo{color:var(--perigo)}
.btn-texto{border:0;background:none;color:var(--acento);font-weight:600;cursor:pointer;padding:4px 2px}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:var(--painel);border:1px solid var(--linha);border-radius:10px;box-shadow:0 12px 30px var(--sombra);padding:6px;display:grid;min-width:250px}
.menu button{display:grid;gap:2px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:600}
.menu button small{font-weight:400;color:var(--tinta-suave);font-size:12.5px}
.menu button:hover{background:var(--hover)}
.aviso{max-width:1480px;margin:12px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border:1px solid var(--aviso);background:var(--aviso-fundo);border-radius:8px}
.aviso-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--alt-topo,64px));z-index:19;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso p{margin:0;flex:1 1 280px;min-width:0}
/* corpo */
.corpo{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:grid;gap:2px}
.nav-rotulo{font:600 11px/1 var(--f-texto);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-fraca);padding:16px 10px 6px}
.nav-rotulo:first-child{padding-top:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--tinta-suave);font:500 15px/1.25 var(--f-texto)}
.nav-item:hover{background:var(--hover);color:var(--tinta)}
.nav-item[aria-current="page"]{background:var(--acento-suave);color:var(--tinta);font-weight:600}
.nav-item span{min-width:0;overflow-wrap:anywhere}
.conta{flex:none;font:500 12px/1 var(--f-medida);color:var(--tinta-suave);background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:3px 7px}
.conta.alerta{color:var(--aviso);border-color:var(--aviso);background:var(--aviso-fundo)}
.nav-novo{margin:4px 0 0 10px}
.principal{min-width:0;display:grid;gap:18px;align-content:start}
.cab-pagina{display:grid;gap:6px}
.eyebrow{font:600 12px/1 var(--f-texto);letter-spacing:.12em;text-transform:uppercase;color:var(--acento)}
.cab-pagina h2{margin:0;font:700 30px/1.1 var(--f-titulo);letter-spacing:.01em;text-wrap:balance}
.lead{margin:0;color:var(--tinta-suave);max-width:72ch}
.secao{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.secao-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 14px}
.secao-cab h3{margin:0;font:600 18px/1.2 var(--f-texto)}
.secao-cab p{margin:2px 0 0;font-size:13.5px;color:var(--tinta-suave)}
.vazio{margin:0;color:var(--tinta-suave)}
.dica{margin:0;font-size:13px;color:var(--tinta-suave)}
/* visão geral */
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.numero{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.numero b{font:700 32px/1 var(--f-titulo);color:var(--acento);font-variant-numeric:tabular-nums}
.numero.alerta b{color:var(--aviso)}
.numero span{font-size:13.5px;color:var(--tinta-suave)}
.duas{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.lista-proc{display:grid;gap:10px}
.proc-cartao{display:grid;gap:8px;width:100%;text-align:left;background:var(--painel-2);border:1px solid var(--linha);border-radius:10px;padding:14px;cursor:pointer}
.proc-cartao:hover{border-color:var(--acento)}
.proc-cartao b{font-size:16.5px}
.proc-cartao p{margin:0;color:var(--tinta-suave);font-size:14px}
.progresso{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tinta-suave)}
.barra{flex:1;height:6px;background:var(--linha);border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tinta-suave);background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:2px 9px}
.chip i{width:8px;height:8px;border-radius:50%}
.mini svg{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--linha);background:var(--piso)}
/* tabelas */
.tabela-wrap{position:relative;overflow-x:auto;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.tabela{width:100%;border-collapse:collapse;min-width:680px}
.tabela th{background:var(--cab-tabela);text-align:left;font:600 13px/1.2 var(--f-texto);color:var(--tinta-suave);padding:10px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tabela td{padding:5px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
.tabela tr:last-child td{border-bottom:0}
.tabela tr.marcada td{background:var(--sel-fundo)}
.tabela .col-num{width:46px;text-align:center;padding-top:10px}
.tabela .col-acoes{width:1%;white-space:nowrap;padding-top:7px}
.cel{width:100%;min-width:0;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;font:500 15px/1.35 var(--f-texto);color:var(--tinta)}
.cel:hover{border-color:var(--linha)}
.cel:focus{border-color:var(--acento);background:var(--campo);outline:none;box-shadow:0 0 0 3px var(--acento-suave)}
textarea.cel{resize:none;min-height:34px;font-weight:400;overflow:hidden;display:block}
.tabela-passos{min-width:950px}
.tabela .w-quem{width:140px}.tabela .w-onde{width:170px}.tabela .w-prox{width:90px}.tabela .w-sit{width:134px}
.tabela tr.grupo th{background:var(--painel-2);text-align:left;padding:10px;border-bottom:1px solid var(--linha);white-space:normal}
.tabela tr.grupo th span{font-weight:400;color:var(--tinta-suave);margin-left:8px}
.tabela-setores td{width:20%}.tabela-setores td.col-acoes{width:1%}
select.cel{cursor:pointer}
.cel-titulo{font-weight:600}
.sub-cel{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 8px 4px;font-size:12.5px;color:var(--tinta-suave)}
.sub-cel em{font-style:normal;font-weight:600;color:var(--aviso)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sit{font:600 13px/1 var(--f-texto);border-radius:999px;padding:6px 10px;border:1px solid transparent;cursor:pointer}
.sit.ok{background:var(--ok-fundo);color:var(--ok)}
.sit.confirmar{background:var(--aviso-fundo);color:var(--aviso)}
.num-etapa{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;font:600 12px/1 var(--f-medida);color:var(--r-tinta);background:var(--neutro)}
.icone{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:6px;color:var(--tinta-suave);cursor:pointer;font-size:16px;line-height:1}
.icone:hover:not(:disabled){background:var(--hover);color:var(--tinta)}
.icone.perigo:hover:not(:disabled){color:var(--perigo)}
.icone:disabled{opacity:.3;cursor:default}
.linha-botoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* processo */
.cab-proc{display:grid;gap:8px}
#p-nome-pag{font:700 30px/1.1 var(--f-titulo);padding:4px 8px;margin-left:-9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--tinta);width:100%}
#p-nome-pag:hover{border-color:var(--linha)}
#p-nome-pag:focus{border-color:var(--acento);background:var(--campo);outline:none}
.participantes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.raia-chip{display:inline-flex;align-items:center;gap:4px;background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:2px 4px 2px 10px}
.raia-chip i{width:10px;height:10px;border-radius:50%;flex:none}
.raia-chip input{border:0;background:transparent;font:600 14px var(--f-texto);color:var(--tinta);min-width:5ch;max-width:26ch;padding:4px 2px}
.raia-chip input:focus{outline:none;box-shadow:0 1px 0 var(--acento)}
.raia-chip .icone{width:24px;height:24px;font-size:13px}
.fluxo-wrap{overflow-x:auto}
.fluxo-wrap svg{display:block;width:100%;height:auto;margin:0 auto}
#p-obj-pag{margin-left:-8px;color:var(--tinta-suave);font-weight:400;max-width:80ch}
.fluxo-wrap [data-etapa-fluxo]{cursor:pointer}
.legenda-fluxo{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--tinta-suave)}
.legenda-fluxo span{display:inline-flex;align-items:center;gap:6px}
.amostra{display:inline-block;width:22px;height:13px;border:1.5px solid var(--linha-forte);border-radius:3px}
.amostra.inicio{border-color:var(--ok);border-radius:8px}
.amostra.decisao{border-color:var(--aviso)}
.amostra.pendente{border-style:dashed}
/* planta */
.ferramentas-planta{display:flex;flex-wrap:wrap;gap:6px}
.ferr{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--painel-2);cursor:pointer;font:500 13.5px var(--f-texto);color:var(--tinta)}
.ferr:hover{border-color:var(--acento);background:var(--painel)}
.ferr svg{width:24px;height:18px;flex:none}
.opcoes-planta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:14px}
.opcoes-planta label{display:inline-flex;align-items:center;gap:8px;color:var(--tinta-suave)}
.opcoes-planta select,.opcoes-planta input[type="text"]{font:500 14px var(--f-texto);color:var(--tinta);background:var(--campo);border:1px solid var(--linha-forte);border-radius:7px;padding:6px 8px}
.opcoes-planta input[type="text"]{width:5.5em;font-family:var(--f-medida);font-size:13.5px}
.vista-planta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.vista-planta .segmento{width:min(300px,100%)}
.planta-3d{display:block;width:100%;height:auto;border-radius:8px;background:var(--piso)}
.planta-svg{display:block;width:100%;height:auto;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;border-radius:8px;background:var(--piso)}
.planta-svg [data-id].sel-toque,.planta-svg [data-alca]{touch-action:none}
.planta-svg.ampliada{touch-action:none;cursor:grab}
.planta-svg.travada{touch-action:none}
.planta-svg.arrastando{cursor:grabbing}
.sobrepostos{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--perigo)}

  async function reduzirImagem(arq) {

  /* ---------- alterações e histórico ---------- */

  const SO_EDICAO = ['desfazer', 'salvar', 'item-add', 'item-girar', 'item-frente', 'item-duplicar', 'item-excluir', 'item-abertura', 'proc-novo', 'proc-excluir', 'raia-add', 'raia-subir', 'raia-descer',

      case 'item-ir': if (itemDe(d.id)) { selItem = d.id; gaveta = { tipo: 'item', id: d.id }; render(); acender(d.id); } break;

      const imgs = {
        logo: bytesDe(SETE_LOGO),
        capa: await peca(pecaCapa(), 2.5),
        simbolos: await peca(pecaSimbolos()),
        andamento: await peca(pecaAndamento(res.andamento)),
        participantes: await peca(pecaBarrasMeia(res.participantes)),
        locais: await peca(pecaBarrasMeia(res.locais)),
        planta: await paraDoc(exportar(() => embrulhar(desenhar({}), 130, '#ffffff'))),
        planta3d: await paraDoc(exportar(() => embrulhar(desenhar3D({ rot: 0 }), 110, '#ffffff'))),
        processos: {}
      };
      for (const p of estado.processos) {
        const c = contagem(p);
        imgs.processos[p.id] = {
          medidor: await peca(pecaMedidor(c.ok, c.total), 4),
          fluxo: await paraDoc(exportar(() => embrulhar(svgFluxo(p, null), 4, '#ffffff'))),
          rota: p.etapas.some((x) => itemDe(x.local)) ? await paraDoc(exportar(() => embrulhar(desenhar({ proc: p }), 130, '#ffffff'))) : null
        };
      }
      const blob = await manterFontes(await D.Packer.toBlob(montarManual(D, imgs)));
      gerando = false; renderStatus();
      await nsDownloads.save({ filename: 'Layout e processos Paiol.docx', data: blob });
    } catch (err) { tratarErroDownload(err, 'Não foi possível gerar o manual neste navegador.'); }
    finally { gerando = false; renderStatus(); }
  }

  /* ---------- início ---------- */
  $('app').innerHTML = shell();
  // depois de salvar a página recarrega; volta para a tela em que a pessoa estava
  try { const t = JSON.parse(localStorage.getItem(CHAVE_TELA) || 'null'); if (t && typeof t.vista === 'string') { vista = t.vista; procRota = t.procRota || null; vista3d = !!t.vista3d; rot3d = [0, 1, 2, 3].indexOf(t.rot3d) >= 0 ? t.rot3d : 0; } } catch (e) { /* sem armazenamento */ }
  function iniciarComDados() {
  const rasc = consulta ? null : lerRascunho();
  if (rasc && valido(rasc.estado) && chave(rasc.estado) !== chave(salvo)) {
    if (rasc.base === chave(salvo)) {
      estado = clonar(rasc.estado); estado.salvoEm = salvo.salvoEm;
      mostrarAviso('Recuperamos as mudanças que você fez e ainda não tinha salvado.', [{ acao: 'descartar', rotulo: 'Descartar mudanças' }]);
    } else {
      rascunhoPendente = clonar(rasc.estado);
      mostrarAviso('Você tinha mudanças não salvas, feitas sobre uma versão anterior.', [{ acao: 'aplicar', rotulo: 'Aplicar minhas mudanças' }, { acao: 'descartar', rotulo: 'Manter a versão salva' }]);
    }
  } else if (rasc) apagarRascunho();
  if (vista.indexOf('proc:') === 0 && !procAberto()) vista = 'geral';
  if (procRota && !procDe(procRota)) procRota = null;
  render();
  }
  if (MODO_SERVIDOR) { renderStatus(); entrarServidor(); } else iniciarComDados();
  $('form-entrada').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const s = $('senha').value;
    if (!s) return;
    guardarSenha(s, $('lembrar').checked);
    autoParado = false;
    if (!dadosCarregados) entrarServidor();
    else { esconderEntrada(); salvarServidor(); }
  });
  window.addEventListener('beforeunload', (ev) => { if (MODO_SERVIDOR && (salvando || chave(estado) !== chave(salvo))) { ev.preventDefault(); ev.returnValue = ''; } });

  const app = $('app');
  app.addEventListener('click', (ev) => {
    if (!ev.target.closest('#busca') && !ev.target.closest('[data-acao="abrir-busca"]')) renderBusca(false);
    if (arrastou3 && ev.target.closest('#svg-planta-3d')) { arrastou3 = false; return; }
    if (ev.target.id === 'visor') { visorAberto = null; renderVisor(); return; }
    const b = ev.target.closest('[data-acao]');
    if (b && !b.disabled) { acao(b.dataset.acao, b); return; }
    const m3 = ev.target.closest('[data-marcador3]');
    if (m3 && procRota) { abrirEtapa(procRota, m3.getAttribute('data-marcador3')); return; }
    const b3 = ev.target.closest('[data-id3]');
    if (b3) { const id = b3.getAttribute('data-id3'); selItem = id; gaveta = { tipo: 'item', id }; renderGaveta(); desenharTela(); return; }
    if (ev.target.closest('#svg-planta-3d') && gaveta && gaveta.tipo === 'item') { selItem = null; gaveta = null; renderGaveta(); desenharTela(); return; }
    const fl = ev.target.closest('[data-etapa-fluxo]');
    if (fl) { const p = procAberto(); if (p) abrirEtapa(p.id, fl.getAttribute('data-etapa-fluxo')); return; }
    const a = ev.target.closest('[data-aviso]');
    if (a) {
      const qual = a.dataset.aviso;
      if (qual === 'recarregar') { try { location.reload(); } catch (e) { /* sem recarregar */ } return; }
      if (qual === 'descartar') { estado = clonar(salvo); historico = []; rascunhoPendente = null; corrigirSelecao(); apagarRascunho(); render(); }
      else if (qual === 'aplicar' && rascunhoPendente) { const pend = rascunhoPendente; rascunhoPendente = null; alterar(() => { estado.planta = pend.planta; estado.processos = pend.processos; estado.setores = pend.setores; corrigirSelecao(); }); }
      esconderAviso();
      return;
    }
    if (menuAberto && !ev.target.closest('#menu-exportar')) { menuAberto = false; renderStatus(); }
  });
  app.addEventListener('focusin', (ev) => { if (ev.target.dataset && ev.target.dataset.campo && ev.target.tagName !== 'SELECT') inicioEdicao = JSON.stringify(estado); });
  app.addEventListener('focusout', (ev) => { if (ev.target.dataset && ev.target.dataset.campo && ev.target.tagName !== 'SELECT') { confirmarEdicao(); inicioEdicao = null; } });
  app.addEventListener('input', aoDigitar);
  app.addEventListener('change', aoMudar);
  app.addEventListener('pointerdown', aoPressionar);
  app.addEventListener('pointermove', aoMover);
  app.addEventListener('pointerup', aoSoltar);
  app.addEventListener('pointercancel', (ev) => { arrItem = null; toque = null; if (arrPan) { arrPan.svg.classList.remove('arrastando'); arrPan = null; } soltar3(ev); });
  app.addEventListener('toggle', (ev) => { if (ev.target && ev.target.id === 'dobra-ferr') dobraFerr = ev.target.open; }, true);
  app.addEventListener('wheel', (ev) => {
    const svg2 = ev.target.closest && ev.target.closest('#svg-planta');
    if (svg2 && (ev.ctrlKey || ev.metaKey || zoom2.k > 1.001)) {
      ev.preventDefault();
      const r = svg2.getBoundingClientRect(), vb = svg2.viewBox.baseVal;
      zoom2Em(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0025)), vb.x + (ev.clientX - r.left) * (vb.width / r.width), vb.y + (ev.clientY - r.top) * (vb.height / r.height));
      return;
    }
    const svg = ev.target.closest && ev.target.closest('#svg-planta-3d');
    if (!svg || !(ev.ctrlKey || ev.metaKey || zoom3.k > 1.001)) return;
    // com Ctrl (ou o gesto de pinça do trackpad) aproxima; já aproximado, a rodinha também aproxima e afasta
    ev.preventDefault();
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    zoomEm(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0025)), vb.x + (ev.clientX - r.left) * (vb.width / r.width), vb.y + (ev.clientY - r.top) * (vb.height / r.height));
  }, { passive: false });
  const campoBusca = $('busca-campo');
  campoBusca.addEventListener('keydown', (ev) => {
    const n = busca.itens.length;
    if (ev.key === 'ArrowDown' && n) { ev.preventDefault(); busca.indice = (busca.indice + 1) % n; renderBusca(true); }
    else if (ev.key === 'ArrowUp' && n) { ev.preventDefault(); busca.indice = (busca.indice - 1 + n) % n; renderBusca(true); }
    else if (ev.key === 'Enter') { ev.preventDefault(); if (n) irParaResultado(busca.itens[Math.max(0, busca.indice)]); }
    else if (ev.key === 'Escape') { ev.preventDefault(); fecharBusca(true); campoBusca.blur(); }
  });
  campoBusca.addEventListener('focus', () => { if (campoBusca.value) { busca = { itens: resultadosBusca(campoBusca.value), indice: -1 }; renderBusca(true); } });
  document.addEventListener('keydown', aoTeclar);
  let espera = null;
  medirTopo();
  window.addEventListener('resize', () => { clearTimeout(espera); espera = setTimeout(() => { medirTopo(); $('principal').querySelectorAll('textarea.cel').forEach(autoAltura); }, 120); });

  usar('artifact').then((ns) => { nsArtifact = ns; if (!ns && !foraDoClaude) salvarIndisponivel = true; renderStatus(); });
  // Fora do Claude (arquivo aberto direto no navegador), o download sai pelo próprio navegador
  const foraDoClaude = !(window.claude && typeof window.claude.use === 'function');
  const baixarLocal = {
    save: ({ filename, data }) => new Promise((ok, falha) => {
      try {
        const blob = data instanceof Blob ? data : new Blob([data]);
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = filename; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        ok({ status: 'saved' });
      } catch (e) { falha({ code: 'unavailable' }); }
    })
  };
  usar('downloads').then((ns) => { nsDownloads = ns || (foraDoClaude ? baixarLocal : null); renderStatus(); });
})();
</script>
